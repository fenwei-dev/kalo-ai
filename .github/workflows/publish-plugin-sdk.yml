name: Publish Kalo plugin SDK

on:
  workflow_dispatch:
  push:
    tags:
      - "plugin-sdk-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(jq -r .version packages/plugin-sdk/package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "plugin-sdk-v$VERSION"
          fi

      - name: Build npm files and validate TypeScript
        run: bun run --filter @kalo-ai/plugin-sdk check

      - name: Inspect npm package contents
        run: npm pack --dry-run ./packages/plugin-sdk

      - name: Validate JSR package
        working-directory: packages/plugin-sdk
        shell: bash
        run: |
          VERSION="$(jq -r .version package.json)"
          deno publish --dry-run --set-version "$VERSION"

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Publish npm package with provenance
        working-directory: packages/plugin-sdk
        run: npm publish --access public --provenance

  publish-jsr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish JSR package with GitHub OIDC
        working-directory: packages/plugin-sdk
        shell: bash
        run: |
          VERSION="$(jq -r .version package.json)"
          deno publish --set-version "$VERSION"
