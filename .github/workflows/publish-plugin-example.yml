name: Publish Kalo example plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "plugin-example-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin-example-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(jq -r .version packages/plugin-example/package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "plugin-example-v$VERSION"
          fi

      - name: Build npm files and validate TypeScript
        run: bun run --filter @kalo-ai/plugin-example check

      - name: Run plugin tests
        run: bun test packages/plugin-example apps/web/tests/pluginPackageExports.test.ts

      - name: Inspect npm package contents
        run: npm pack --dry-run ./packages/plugin-example

      - name: Prepare JSR source
        run: bun run --filter @kalo-ai/plugin-example prepare:jsr

      - name: Validate JSR package
        working-directory: packages/plugin-example/.jsr-publish
        shell: bash
        run: |
          VERSION="$(jq -r .version ../package.json)"
          deno publish --dry-run --set-version "$VERSION"

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check whether npm version already exists
        id: npm-version
        working-directory: packages/plugin-example
        shell: bash
        run: |
          VERSION="$(jq -r .version package.json)"
          if npm view "@kalo-ai/plugin-example@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm version $VERSION already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package with provenance
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/plugin-example
        run: npm publish --access public --provenance

  publish-jsr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare JSR source
        run: bun run --filter @kalo-ai/plugin-example prepare:jsr

      - name: Publish JSR package with GitHub OIDC
        working-directory: packages/plugin-example/.jsr-publish
        shell: bash
        run: |
          VERSION="$(jq -r .version ../package.json)"
          deno publish --set-version "$VERSION"
