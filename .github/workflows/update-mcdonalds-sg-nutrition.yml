name: Update McDonald's Singapore nutrition data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mcdonalds-sg-nutrition
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch official nutrition data
        run: bun run --filter @kalo-ai/plugin-mcdonalds-sg update-data
        env:
          MCD_CONCURRENCY: "3"

      - name: Validate plugin
        run: |
          bun run --filter @kalo-ai/plugin-mcdonalds-sg check
          bun run --filter @kalo-ai/plugin-mcdonalds-sg test

      - name: Detect nutrition snapshot changes
        id: nutrition_changes
        shell: bash
        run: |
          DATA_PATH="packages/plugin-mcdonalds-sg/data/products.json"
          if [[ -n "$(git status --porcelain -- "$DATA_PATH")" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$DATA_PATH"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Official product and category data are unchanged."
          fi

      - name: Create update pull request
        if: steps.nutrition_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-mcdonalds-sg-nutrition
          delete-branch: true
          commit-message: "chore(data): update McDonald's Singapore nutrition"
          title: "chore(data): update McDonald's Singapore nutrition"
          body: |
            Automated refresh of the static McDonald's Singapore nutrition snapshot.

            Source: https://www.mcdonalds.com.sg/full-menu

            The update script writes the file only when normalized product or category data changes, so this workflow creates no pull request when the official data is unchanged.
          add-paths: |
            packages/plugin-mcdonalds-sg/data/products.json
