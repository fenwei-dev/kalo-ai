name: Update Subway Singapore nutrition data

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-subway-sg-nutrition
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch official nutrition data
        run: bun run --filter @kalo-ai/plugin-subway-sg update-data
        env:
          SUBWAY_CONCURRENCY: "3"

      - name: Validate plugin
        run: |
          bun run --filter @kalo-ai/plugin-subway-sg check
          bun run --filter @kalo-ai/plugin-subway-sg test

      - name: Detect nutrition snapshot changes
        id: nutrition_changes
        shell: bash
        run: |
          DATA_PATH="packages/plugin-subway-sg/data/products.json"
          if [[ -n "$(git status --porcelain -- "$DATA_PATH")" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$DATA_PATH"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Official product and nutrition data are unchanged."
          fi

      - name: Create update pull request
        if: steps.nutrition_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-subway-sg-nutrition
          delete-branch: true
          commit-message: "chore(data): update Subway Singapore nutrition"
          title: "chore(data): update Subway Singapore nutrition"
          body: |
            Automated refresh of the static Subway Singapore nutrition snapshot.

            Source: https://subwayisfresh.com.sg/menu/

            The update script writes the file only when normalized product or nutrition data changes, so this workflow creates no pull request when the official data is unchanged.
          add-paths: |
            packages/plugin-subway-sg/data/products.json
